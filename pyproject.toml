[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-triage"
version = "0.1.0"
description = "Recall-constrained astronomical edge triage research infrastructure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7", "psutil>=5.9,<8"]

[project.optional-dependencies]
data = ["numpy>=2.1,<3", "torch>=2.10,<2.11", "matplotlib>=3.9,<4"]
pipeline = ["edge-triage[data]", "pyarrow>=19,<24"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-PyYAML", "types-psutil"]

[project.scripts]
edge-triage = "edge_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = ["dataset: read-only verification of frozen local dataset"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
